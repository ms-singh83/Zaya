name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # docs/17-DEPLOYMENT.md §5. lint/typecheck/unit/build/security are the M0-M1 gate and
  # required. `migrate` joins once a migration pipeline exists to drive. `integration` runs
  # now (M1 has a schema and an RLS suite, supabase/tests/rls/) but stays non-blocking: it
  # needs a real Supabase instance, which is a founder-provided secret not wired up yet, so
  # every suite in it self-skips via `describe.skipIf(!integrationEnvReady)` rather than
  # failing (supabase/tests/rls/helpers.ts). `continue-on-error` is belt-and-suspenders in
  # case that assumption ever breaks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Enforces the 95% gate on lib/domain. docs/16-TESTING-STRATEGY.md §1.
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    # Non-blocking, and deliberately no Supabase secrets wired in here — that's a founder
    # decision (env/secret provisioning) not made yet. Without NEXT_PUBLIC_SUPABASE_URL /
    # NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY, every suite under
    # supabase/tests/ self-skips via `describe.skipIf(!integrationEnvReady)` (see
    # supabase/tests/rls/helpers.ts) rather than failing, so this job passes vacuously today.
    # `continue-on-error` is belt-and-suspenders for when a real Supabase target is wired in
    # later and a flaky/broken run there shouldn't block the M0-M1 gate on its own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      # A committed secret is treated as compromised. docs/15-SECURITY.md §10.
      - name: Check no env file is tracked
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "An env file is tracked. Rotate the secrets and remove it."
            exit 1
          fi
